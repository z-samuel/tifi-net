<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiFi - Bring AI and Blockchain To Everyday Life</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    body::before {
      content: '';
      position: fixed;
      inset: -20px;
      background: url('logo.svg') center / cover no-repeat;
      filter: blur(18px);
      opacity: 0.35;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .content img {
      width: 120px;
      height: 120px;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #fff;
      text-shadow: 0 2px 16px rgba(0,0,0,0.8);
    }

    p {
      margin-top: 1.2rem;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.7);
      text-shadow: 0 1px 8px rgba(0,0,0,0.8);
      max-width: 420px;
      line-height: 1.6;
      text-align: left;
    }

    .links {
      margin-top: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      text-align: left;
    }

    .links a {
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .links a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="content">
    <img src="logo.svg" alt="TiFi Logo">
    <h1>Farewell, TiFi!</h1>
    <p>TiFi is now closed. Thank you to all our supporters. We remain committed to bringing AI and Blockchain to everyday life.</p>
    <div class="links">
      <a href="https://www.amazon.com/dp/1837634114" target="_blank" rel="noopener">📖 Building Full Stack DeFi Applications on Amazon</a>
      <a href="https://www.linkedin.com/in/samuel-zhou" target="_blank" rel="noopener">💼 Founder LinkedIn</a>
    </div>
  </div>
</body>
</html>
