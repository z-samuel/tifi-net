<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TiFi - Bring AI and Blockchain To Everyday Life</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
    }

    body::before {
      content: '';
      position: fixed;
      inset: -20px;
      background: url('logo.svg') center / cover no-repeat;
      filter: blur(18px);
      opacity: 0.35;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .content img {
      width: 120px;
      height: 120px;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #fff;
      text-shadow: 0 2px 16px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="content">
    <img src="logo.svg" alt="TiFi Logo">
    <h1>TiFi is Closed</h1>
  </div>
</body>
</html>
